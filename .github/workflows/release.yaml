name: Release image

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]+"]

jobs:
  image:
    # native arm64, so the aarch64 image needs no emulation
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Version from the tag, must equal the add-on config
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          config="$(sed -n 's/^version: "\(.*\)"$/\1/p' print-buddy/config.yaml)"
          if [ "$version" != "$config" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version \"$config\" in print-buddy/config.yaml"
            exit 1
          fi
          image="$(sed -n 's/^image: "\(.*\)"$/\1/p' print-buddy/config.yaml)"
          if [ "$image" != "ghcr.io/${GITHUB_REPOSITORY,,}" ]; then
            echo "::error::image \"$image\" in print-buddy/config.yaml is not this repository's GHCR name"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
